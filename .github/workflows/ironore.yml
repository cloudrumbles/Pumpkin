name: Ironore backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_DEV_INCREMENTAL: false
      CARGO_PROFILE_DEV_CODEGEN_UNITS: 256
      RUST_MIN_STACK: 33554432
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p pumpkin-command
      - run: cargo test --locked -p pumpkin-world world_clock_tests
      - run: cargo test --locked -p pumpkin --lib
